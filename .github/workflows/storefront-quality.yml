name: Storefront quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, design/persian-blue-liquid-glass]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Validate static storefront and security headers
        run: node scripts/validate-storefront.mjs
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
